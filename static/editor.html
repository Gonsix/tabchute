<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit group · TabChute</title><link rel="stylesheet" href="styles.css"><script type="module" src="editor.js"></script></head>
<body class="editor"><div class="editor-shell"><header class="brand"><img src="icons/48.png" width="40" height="40" alt=""><div><h1>TabChute</h1><p>Your sites, ready together.</p></div></header><main><div class="page-heading"><div><p class="eyebrow">YOUR COLLECTION</p><h2 id="title">New group</h2><p class="muted">Pick the sites you want to open together.</p></div><span class="badge">Template</span></div><div id="error" class="notice error" role="alert" hidden></div><div id="success" class="notice" role="status" hidden></div><form id="form" novalidate><fieldset id="fields" disabled><section class="panel"><label class="field">Group name<input id="name" placeholder="e.g. Research" required autocomplete="off"><span id="name-error" class="field-error"></span></label><div class="field"><span id="color-label">Group color</span><div id="colors" class="colors" role="radiogroup" aria-labelledby="color-label"></div></div></section><section class="sites-section"><div class="section-heading"><div><h3>Sites</h3><p class="muted">They’ll open in this order.</p></div><button id="add" class="secondary" type="button">＋ Add site</button></div><div id="sites" class="cards"></div></section><div class="editor-actions"><button id="delete" class="danger ghost" type="button" hidden>Delete group</button><div class="action-right"><button id="cancel" class="secondary" type="button">Cancel</button><button id="save" class="primary" type="submit">Save group</button></div></div></fieldset></form></main><footer>Changes here apply the next time you open this group.</footer></div></body></html>
